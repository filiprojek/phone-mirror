name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" >/dev/null

      - name: Release script tests
        run: scripts/tests/release_test.sh

      - name: Unit tests and debug APK
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: PhoneMirror-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
