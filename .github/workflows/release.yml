name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release notes need the history and the previous tag

      - name: Check tag matches VERSION_NAME
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION_NAME=$version in gradle.properties"
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" >/dev/null

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Decode signing keystore
        env:
          PM_KEYSTORE_BASE64: ${{ secrets.PM_KEYSTORE_BASE64 }}
          PM_KEYSTORE_PASSWORD: ${{ secrets.PM_KEYSTORE_PASSWORD }}
          PM_KEY_ALIAS: ${{ secrets.PM_KEY_ALIAS }}
          PM_KEY_PASSWORD: ${{ secrets.PM_KEY_PASSWORD }}
        run: |
          for name in PM_KEYSTORE_BASE64 PM_KEYSTORE_PASSWORD PM_KEY_ALIAS PM_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              exit 1
            fi
          done
          echo "$PM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "PM_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PM_KEYSTORE_PASSWORD: ${{ secrets.PM_KEYSTORE_PASSWORD }}
          PM_KEY_ALIAS: ${{ secrets.PM_KEY_ALIAS }}
          PM_KEY_PASSWORD: ${{ secrets.PM_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify signature and prepare assets
        run: |
          apk="PhoneMirror-$GITHUB_REF_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > "$apk.sha256"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            "PhoneMirror-$GITHUB_REF_NAME.apk" "PhoneMirror-$GITHUB_REF_NAME.apk.sha256" \
            --title "PhoneMirror $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
